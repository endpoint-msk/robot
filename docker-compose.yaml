version: "3.9"
services:
  bot:
    hostname: endpoint-webapp
    build:
      context: .
      args:
        # Коммит, из которого собран образ (подпись в настройках миниаппа). Значение
        # подставляет scripts/deploy.sh; при ручной сборке просто пусто — подписи не будет.
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: always
    # PID 1 должен уметь пожинать зомби и пробрасывать сигналы — иначе SIGTERM не доходит.
    init: true
    # Даём боту дописать стейт и закрыть клиент, прежде чем прилетит SIGKILL.
    stop_grace_period: 30s
    networks:
      - public
    env_file:
      - .env
    # Пути к стейту и сессии — внутрь тома. В образе они пережили бы только до первой
    # пересборки: `docker compose up --build` создаёт новый контейнер, и всё, что лежало
    # вне тома, исчезает. `environment` перекрывает одноимённые значения из env_file.
    environment:
      DATA_FILE: /app/bot-data/data.json
      SESSION_FILE: /app/bot-data/bot.session
    volumes:
      - ./bot-data:/app/bot-data
    # Проверяем не «отвечает ли порт», а «крутятся ли шедулеры и пишется ли стейт»:
    # процесс, у которого умерли таймеры, снаружи выглядит совершенно живым.
    # Работает только с включённым миниаппом (WEBAPP_PORT) - без него ручки нет.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${WEBAPP_PORT:-8080}/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
networks:
  public:
    name: public
    external: true
