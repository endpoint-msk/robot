name: Deploy

# Один воркфлоу на обе ветки, чтобы CI-конфиг не расходился между main и dev.
# main -> прод (DEPLOY_PATH, scripts/deploy.sh), dev -> дев-стенд на том же хосте
# (DEPLOY_DEV_PATH, scripts/dev-seed-and-run.sh: копия прод-БД + подъём контейнера).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Свой лок на ветку: прод и дев деплоятся параллельно, но каждый сам с собой — нет.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Фронт миниаппа тайпчекается отдельно: у него свой tsconfig, а корневой
      # include ограничен src/**. Без этого шага ошибка типов во фронте проходила
      # CI зелёной и падала уже в `docker build` на боевом хосте — после того как
      # деплой успел перевести чекаут на новый коммит.
      - run: npm --prefix webapp ci
      - run: npm --prefix webapp run typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            # Ветвимся явно: без else в прод стрелять нельзя — иначе ручной dispatch
            # на чужой ветке задеплоил бы её код на боевой хост. if/elif вместо case:
            # удалённый логин-шелл — zsh, а case ... ;; esac он парсит иначе.
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd ${{ secrets.DEPLOY_PATH }}
              git fetch --prune origin
              # Жёстко на конкретный коммит: хост — не место для локальных правок.
              git reset --hard ${{ github.sha }}
              bash scripts/deploy.sh
            elif [ "${{ github.ref_name }}" = "dev" ]; then
              cd ${{ secrets.DEPLOY_DEV_PATH }}
              git fetch --prune origin
              git reset --hard ${{ github.sha }}
              bash scripts/dev-seed-and-run.sh
            else
              echo "Ветка ${{ github.ref_name }} не деплоится." >&2
              exit 1
            fi
